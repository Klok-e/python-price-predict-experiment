[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netgrowth"
version = "0.1.0"
description = "Causal direct Net Log Growth portfolio-policy experiment"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "torch>=2.7,<3",
]

[project.scripts]
netgrowth = "netgrowth.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["netgrowth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["netgrowth"]
